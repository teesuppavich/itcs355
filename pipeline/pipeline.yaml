# Lab 5: pipeline as a neutral DAG.
#
# This file describes WHAT runs. cloudlayer/pipelines.py compiles it into SageMaker
# Pipelines, Azure ML Pipelines, or Vertex AI Pipelines. Every step is a command in one
# container image; the logic lives in scripts/pipeline_steps.py, not in this file.
# The training machine type is fixed inside the adapter (submit_training).

name: itcs355-training-pipeline
schedule: "0 2 * * 0"          # TODO(Lab 5): justify this in your README, or change it

steps:
  - name: ingest
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "ingest"]

  - name: validate
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "validate"]
    depends_on: [ingest]
    on_failure: abort
    # Aborting here is the point. A pipeline that trains on data failing its own contract
    # produces a model nobody should trust, and it will do so silently.

  - name: train
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "train"]
    depends_on: [validate]
    spot: true
    outputs: [run_name]

  - name: evaluate
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "gate"]
    depends_on: [train]
    outputs: [gate_decision]

  - name: register
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "register"]
    depends_on: [evaluate]
    condition: "gate_decision == 'pass'"
    outputs: [model_ref]

  - name: deploy_staging
    image: "${PIPELINE_IMAGE}"
    command: ["python", "-m", "scripts.pipeline_steps", "deploy"]
    depends_on: [register]

tags:
  course: itcs355
  student: "${PROJECT_ID}"
  lab: "5"
