services:
  service:
    build:
      context: .
      dockerfile: service/Dockerfile.serve
    command: uvicorn service.app:app --host 0.0.0.0 --port 8080 --workers 1
    environment:
      MODEL_PATH: /app/reports/model.joblib
      MODEL_VERSION: local
    volumes:
      - ./reports:/app/reports:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - service

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/prediction.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
