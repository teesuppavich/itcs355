# ITCS355 Lab 4 — continuous integration.
#
# The sequence matters: cheap checks first, so a schema mistake fails in 30 seconds
# rather than after a build. Deploy is in cd.yml and runs only on main, only on green.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: make scan-secrets

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Lint
        run: ruff check src/ service/ monitoring/ scripts/ tests/

      - name: Portability audit
        run: python scripts/portability_audit.py

      - name: Generate dataset
        run: python scripts/make_dataset.py

      - name: Data contract tests
        run: pytest -q tests/test_data.py

      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py

      - name: Service tests
        run: pytest -q tests/test_service.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The integration test below runs make_dataset/train/export on the runner to
      # produce the artefact the serving container is then asked to serve.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .

      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .

      - name: Integration test
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib

          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-serve:${{ github.sha }}

          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break || sleep 2
          done

          response=$(curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}')

          echo "$response"

          RESPONSE="$response" python -c '
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])

          assert "probability" in data
          assert "model_version" in data
          assert isinstance(data["probability"], (int, float))
          assert 0.0 <= data["probability"] <= 1.0
          assert data["model_version"] == "${{ github.sha }}"
          '

          headers=$(curl -sS -D - -o /dev/null -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}')

          echo "$headers"

          header_version=$(printf '%s\n' "$headers" \
            | awk -F': ' 'tolower($1) == "x-model-version" {gsub("\r","",$2); print $2}')

          test "$header_version" = "${{ github.sha }}"

          docker stop svc

      # Images are tagged with the commit SHA, never `latest`.
