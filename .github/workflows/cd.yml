# ITCS355 Lab 4 — continuous deployment.
#
# Runs after CI completes successfully on main.
# GCP authentication uses GitHub Actions OIDC / Workload Identity Federation.
# The deployed image is rebuilt from the exact commit that passed CI.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    env:
      CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      IDENTITY_REF: ${{ secrets.GCP_DEPLOY_SA }}

      MODEL_REF: ${{ vars.MODEL_REF }}
      ENDPOINT: ${{ vars.ENDPOINT }}
      INSTANCE: ${{ vars.INSTANCE }}

      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt

      - name: Build SHA-tagged serving image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f service/Dockerfile.serve \
            -t "itcs355-serve:${COMMIT_SHA}" \
            --load .

      - name: Push SHA-tagged serving image
        run: |
          digest_ref="$(
            python -c "from src import config; from cloudlayer.factory import get_adapter; cfg=config.load(); print(get_adapter(cfg).push_image('itcs355-serve:${COMMIT_SHA}'))" \
            | tail -n 1
          )"
          echo "Pushed image: ${digest_ref}"
          echo "SERVING_IMAGE=${digest_ref}" >> "$GITHUB_ENV"

      - name: Deploy to staging
        run: |
          python -c "from src import config; from cloudlayer.factory import get_adapter; cfg=config.load(); print(get_adapter(cfg).deploy('${MODEL_REF}', '${ENDPOINT}', '${INSTANCE}'))"

      - name: Smoke test
        run: |
          PYTHONPATH=. python scripts/smoke.py --endpoint "${ENDPOINT}"
