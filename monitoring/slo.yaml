service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses on /predict routes, excluding 4xx"
    on_budget_exhausted: |
      Target is 99.5% because the service runs as a single deployment without multi-region
      redundancy; 99.5% allows about 3.6 hours of failed requests per 30 days, enough to absorb
      one bad deploy plus rollback, while 99.9% (about 43 minutes) would require redundancy this
      project does not pay for.
      When the budget is spent: freeze all deploys except the fix, roll back to the last
      known-good model version in the registry, and write a post-mortem within two days. The
      target is only revised after that review, never during the incident.

  - name: latency
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Stop shipping model or dependency changes until p95 is back under target. Compare the
      p95 and p99 panels against the last load test to decide between a regression in the new
      version (roll back) and a capacity problem (raise the minimum replica count).

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Retrain on the latest validated data and ship through the normal CI pipeline. If the
      drift check shows a schema or null-rate change, do not retrain: keep serving the current
      model, open an incident, and fix the data producer first. The Lab 5 retrain schedule must
      be at most 30 days to stay consistent with this target.
